<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

/* Native answer bar (mobile web): a real HTML input, because
   Godot's own LineEdit drops composed virtual-keyboard text on
   Android web. It is NOT fixed to the top of the screen (that
   covered the dialog's question): the game positions it over its
   own input slot inside the dialog card via __tnPlaceAnswer, so
   it sits exactly where the LineEdit would be, under the
   question text. Hidden until the game shows it. */
#tn-answer-bar {
	display: none;
	position: absolute;
	z-index: 1000;
	gap: 8px;
}

#tn-answer-input {
	flex: 1;
	min-width: 0;
	font-size: 18px;
	padding: 10px 12px;
	color: #f5eed7;
	background: #2a1d20;
	border: 2px solid #c79e47;
	border-radius: 8px;
	outline: none;
}

#tn-answer-submit {
	font-size: 18px;
	padding: 10px 16px;
	color: #f5eed7;
	background: #6b4d33;
	border: 2px solid #c79e47;
	border-radius: 8px;
	/* The bar stretches to the game's tall input row, so the
	   label must be centred explicitly: a plain <button> can
	   sit off-centre once flex stretching makes it taller
	   than its content. */
	display: flex;
	align-items: center;
	justify-content: center;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<script>
		// Let browser shortcuts reach the browser. Godot's web glue
		// calls preventDefault() on EVERY canvas keydown, which swallows
		// F11, F12, F5 and Ctrl-combos while the game has focus. This
		// capture-phase window listener stops reserved keys before they
		// reach the canvas listener, deliberately WITHOUT preventDefault,
		// so the browser still performs its default action. Game keys
		// (WASD, arrows, plain typing) and text-editing shortcuts
		// (Ctrl+A/C/V/X/Z/Y/U, for the answer field) are left alone,
		// as is AltGr (Ctrl+Alt), so typing symbols keeps working.
		window.addEventListener('keydown', function (event) {
			var key = event.key || '';
			var isFunctionKey = key.length > 1 && key[0] === 'F' && !isNaN(parseInt(key.slice(1), 10));
			var withMod = event.ctrlKey || event.metaKey;
			var editKeys = ['a', 'c', 'v', 'x', 'z', 'y', 'u'];
			var passThrough = isFunctionKey
				|| key === 'Escape'
				|| (event.altKey && !event.ctrlKey && !event.metaKey)
				|| (withMod && !event.altKey && editKeys.indexOf(key.toLowerCase()) === -1);
			if (passThrough) {
				event.stopPropagation();
			}
		}, true);
		</script>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<div id="tn-answer-bar">
			<input id="tn-answer-input" type="text" inputmode="text" enterkeyhint="go" placeholder="Введите ответ…" autocomplete="off" autocapitalize="off" spellcheck="false">
			<button id="tn-answer-submit" type="button">Ответить</button>
		</div>
		<script>
		// Native answer bar (mobile web): Godot's own LineEdit drops
		// composed text from Android virtual keyboards (focus opens,
		// autocomplete runs, but nothing lands in the field), so
		// hidden-answer dialogs type here instead, and the value is
		// handed back to the game through window.__tnAnswerCallback
		// (set by the game at startup via JavaScriptBridge). The bar
		// lives inside the dialog card: the game places it over its
		// input slot with __tnPlaceAnswer (viewport coordinates plus
		// the viewport size, so canvas scaling and page offset are
		// accounted for) and re-places it whenever that slot moves
		// (sidebar scroll, resize, dialog sheet).
		function __tnPlaceAnswer(x, y, w, h, vw, vh) {
			var bar = document.getElementById('tn-answer-bar');
			var canvas = document.getElementById('canvas');
			if (!bar || !canvas || !vw || !vh) {
				return;
			}
			var rect = canvas.getBoundingClientRect();
			var scaleX = rect.width / vw;
			var scaleY = rect.height / vh;
			bar.style.left = (rect.left + x * scaleX) + 'px';
			bar.style.top = (rect.top + y * scaleY) + 'px';
			bar.style.width = (w * scaleX) + 'px';
			bar.style.height = (h * scaleY) + 'px';
		}
		function __tnShowAnswer() {
			// Desktops keep the game's LineEdit (physical keyboards
			// work there); only touch devices get the native bar.
			if (!('ontouchstart' in window) && navigator.maxTouchPoints <= 0) {
				return false;
			}
			var bar = document.getElementById('tn-answer-bar');
			var input = document.getElementById('tn-answer-input');
			input.value = '';
			bar.style.display = 'flex';
			input.focus();
			return true;
		}
		function __tnHideAnswer() {
			var bar = document.getElementById('tn-answer-bar');
			if (bar) {
				bar.style.display = 'none';
			}
		}
		function __tnFocusAnswer() {
			var input = document.getElementById('tn-answer-input');
			if (input) {
				input.focus();
				input.select();
			}
		}
		function __tnSubmitAnswer() {
			var input = document.getElementById('tn-answer-input');
			if (input && window.__tnAnswerCallback) {
				window.__tnAnswerCallback(input.value);
			}
		}
		document.getElementById('tn-answer-submit').addEventListener('click', __tnSubmitAnswer);
		document.getElementById('tn-answer-input').addEventListener('keydown', function (event) {
			if (event.key === 'Enter') {
				event.preventDefault();
				__tnSubmitAnswer();
			}
		});
		</script>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
